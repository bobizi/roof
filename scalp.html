<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Автопилот корзин · Binance · мультипара</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  body{font-family:'IBM Plex Sans',system-ui,sans-serif}
  .mono{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}
  input,select{outline:none}input:focus,select:focus{border-color:#3b82f6!important}
  ::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#30363d;border-radius:4px}
  #banner{transition:transform .3s,opacity .3s;transform:translate(-50%,-70px);opacity:0}
  #banner.show{transform:translate(-50%,0);opacity:1}
</style>
</head>
<body class="bg-[#0d1117] text-gray-200 text-sm min-h-screen">

<div id="banner" class="fixed top-3 left-1/2 z-50 mono text-xs font-semibold px-4 py-2 rounded border pointer-events-none"></div>

<!-- ═══ верхняя панель ═══ -->
<header class="flex flex-wrap items-center gap-3 px-4 py-2.5 border-b border-[#30363d]">
  <b class="text-[15px]">Автопилот корзин</b>
  <span class="text-xs text-gray-500">Binance · paper</span>
  <span id="wsTxt" class="text-xs text-gray-400">подключение…</span>
  <span id="latEl" class="mono text-xs text-gray-500"></span>
  <div class="flex-1"></div>
  <span id="clock" class="mono text-xs text-gray-400"></span>
</header>

<!-- ═══ настройки ═══ -->
<div class="px-4 py-3 border-b border-[#30363d] flex flex-wrap items-end gap-x-4 gap-y-2">
  <label class="text-[10px] uppercase text-gray-500 flex flex-col gap-1">Ставка $<input id="baseUsd" type="number" value="100" min="10" step="10" class="w-24 bg-[#0d1117] border border-[#30363d] rounded px-2 py-1 mono text-[12px]"></label>
  <label class="text-[10px] uppercase text-gray-500 flex flex-col gap-1">Цель корзины $<input id="tpUsd" type="number" value="0.80" min="0.05" step="0.05" class="w-24 bg-[#0d1117] border border-[#30363d] rounded px-2 py-1 mono text-[12px]"></label>
  <label class="text-[10px] uppercase text-gray-500 flex flex-col gap-1">Шаг %<input id="stepAdd" type="number" value="0.10" min="0.02" step="0.01" class="w-20 bg-[#0d1117] border border-[#30363d] rounded px-2 py-1 mono text-[12px]"></label>
  <label class="text-[10px] uppercase text-gray-500 flex flex-col gap-1">Стоп $<input id="maxDD" type="number" value="5" min="0.5" step="0.5" class="w-20 bg-[#0d1117] border border-[#30363d] rounded px-2 py-1 mono text-[12px]"></label>
  <label class="text-[10px] uppercase text-gray-500 flex flex-col gap-1">Макс ставок<input id="maxOrd" type="number" value="40" min="3" max="100" class="w-20 bg-[#0d1117] border border-[#30363d] rounded px-2 py-1 mono text-[12px]"></label>
  <label class="text-[10px] uppercase text-gray-500 flex flex-col gap-1">Пауза мс<input id="cooldownMs" type="number" value="1500" min="0" step="250" class="w-20 bg-[#0d1117] border border-[#30363d] rounded px-2 py-1 mono text-[12px]"></label>
  <label class="text-[10px] uppercase text-gray-500 flex flex-col gap-1">Первый вход
    <select id="dirMode" class="bg-[#0d1117] border border-[#30363d] rounded px-2 py-1 mono text-[12px]">
      <option value="auto">Авто EMA</option><option value="BUY">BUY</option><option value="SELL">SELL</option>
    </select></label>

  <div class="flex items-end gap-3 pl-2 border-l border-[#30363d]">
    <span class="text-[10px] uppercase text-gray-500 pb-1.5">Пары:</span>
    <div id="pairBox" class="flex flex-wrap gap-x-3 gap-y-1"></div>
  </div>

  <div class="flex gap-2 ml-auto">
    <button id="btnStart" class="px-4 py-1.5 rounded bg-green-700 hover:bg-green-600 text-white text-xs font-semibold">Старт</button>
    <button id="btnStop" disabled class="px-4 py-1.5 rounded bg-red-800 hover:bg-red-700 disabled:opacity-40 text-white text-xs font-semibold">Стоп</button>
    <button id="btnReset" class="px-3 py-1.5 rounded border border-[#30363d] hover:border-gray-400 text-xs">Сброс</button>
    <label class="flex items-center gap-1.5 text-xs text-gray-400 cursor-pointer"><input id="sndChk" type="checkbox" checked class="accent-blue-500">звук</label>
  </div>
</div>

<!-- ═══ итог ═══ -->
<div class="px-4 py-3 border-b border-[#30363d] grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-7 gap-2">
  <div class="bg-[#161b22] border border-[#30363d] rounded p-2">
    <div class="text-[10px] uppercase text-gray-500">Реализовано всего</div>
    <div id="stReal" class="mono text-lg font-bold text-green-400">$0.00</div>
  </div>
  <div class="bg-[#161b22] border border-[#30363d] rounded p-2">
    <div class="text-[10px] uppercase text-gray-500">Ставок выиграно</div>
    <div id="stOW" class="mono text-lg font-bold text-green-400">0</div>
    <div id="stOWsum" class="mono text-[11px] text-green-500">+$0.00</div>
  </div>
  <div class="bg-[#161b22] border border-[#30363d] rounded p-2">
    <div class="text-[10px] uppercase text-gray-500">Ставок проиграно</div>
    <div id="stOL" class="mono text-lg font-bold text-red-400">0</div>
    <div id="stOLsum" class="mono text-[11px] text-red-500">−$0.00</div>
  </div>
  <div class="bg-[#161b22] border border-[#30363d] rounded p-2">
    <div class="text-[10px] uppercase text-gray-500">Итог по ставкам</div>
    <div id="stONet" class="mono text-lg font-bold">$0.00</div>
    <div id="stORate" class="mono text-[11px] text-gray-400">—</div>
  </div>
  <div class="bg-[#161b22] border border-[#30363d] rounded p-2">
    <div class="text-[10px] uppercase text-gray-500">Корзины</div>
    <div id="stB" class="mono text-lg font-bold">0</div>
    <div class="text-[11px]"><span id="stW" class="text-green-400">0</span>/<span id="stL" class="text-red-400">0</span> <span id="stWR" class="mono text-gray-400">—</span></div>
  </div>
  <div class="bg-[#161b22] border border-[#30363d] rounded p-2 col-span-2">
    <div class="text-[10px] uppercase text-gray-500">Эквити</div>
    <canvas id="eqCanvas" class="w-full h-9 block"></canvas>
  </div>
</div>

<!-- ═══ карточки пар ═══ -->
<main id="cards" class="p-4 grid gap-3 md:grid-cols-2 xl:grid-cols-3"></main>

<!-- ═══ журнал ═══ -->
<section class="px-4 pb-4">
  <div id="logBox" class="h-44 overflow-y-auto bg-[#161b22] border border-[#30363d] rounded p-2 mono text-[11px] leading-relaxed"></div>
</section>

<footer class="text-center text-gray-600 text-[11px] pb-5">Симуляция без комиссий. Данные — публичные потоки Binance. Для live-ордеров нужен серверный прокси.</footer>

<script>
'use strict';
const $=id=>document.getElementById(id);
const fmt=(n,d=2)=>Number(n).toLocaleString('ru-RU',{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtS=(n,d=2)=>(n>=0?'+':'−')+fmt(Math.abs(n),d);
const round2=n=>Math.round(n*100)/100;
const roundStep=(v,s)=>Math.round(v/s)*s;
const hhmmss=()=>new Date().toLocaleTimeString('ru-RU');
const LS='basket-autopilot.v1';

const PAIRS=['BTCUSDT','ETHUSDT','SOLUSDT','BNBUSDT','XRPUSDT','DOGEUSDT'];
const sel=new Set(['BTCUSDT','ETHUSDT','SOLUSDT']);
const P={};                                  /* состояние каждой пары */
const G={running:false,baskets:0,wins:0,losses:0,ordWin:0,ordLoss:0,ordWinSum:0,ordLossSum:0,
         eqHist:[],lastEq:0,lastEqPush:0,lat:0};
let ws=null,retries=0,pollTimer=null;

function cfg(){return{
  base:Math.max(10,+$('baseUsd').value||100), tp:Math.max(.05,+$('tpUsd').value||.8),
  step:Math.max(.02,+$('stepAdd').value||.1), maxDD:Math.max(.5,+$('maxDD').value||5),
  maxOrders:Math.max(3,+$('maxOrd').value|0||40), cooldown:Math.max(0,+$('cooldownMs').value|0||1500),
  dir:$('dirMode').value};}

function initPair(sym){if(P[sym])return;
  P[sym]={sym,price:0,prev:0,ticks:0,tickSize:.01,emaF:null,emaS:null,hist:[],lastHist:0,
    realized:0,baskets:0,wins:0,losses:0,ordWin:0,ordLoss:0,ordWinSum:0,ordLossSum:0,
    basket:null,lastCloseTs:0,warmWarned:false,el:null,rowRefs:new Map()};}
PAIRS.forEach(initPair);

/* ═══ лог / баннер / звук ═══ */
function log(type,msg){
  const C={sys:'text-sky-400',buy:'text-green-400',sell:'text-red-400',flip:'text-amber-400',
           ok:'text-green-300 font-semibold',err:'text-red-300 font-semibold',warn:'text-amber-300'};
  const box=$('logBox'),d=document.createElement('div');
  d.className=C[type]||'text-gray-300';
  d.innerHTML=`<span class="text-gray-600">${hhmmss()}</span> ${msg}`;
  box.prepend(d);while(box.children.length>220)box.lastChild.remove();
}
let banT;
function banner(text,win){
  const b=$('banner');b.textContent=text;
  b.className='fixed top-3 left-1/2 z-50 mono text-xs font-semibold px-4 py-2 rounded border pointer-events-none show '+
    (win?'bg-[#0c2b1c] border-green-600 text-green-300':'bg-[#331015] border-red-700 text-red-300');
  clearTimeout(banT);banT=setTimeout(()=>b.classList.remove('show'),2500);
}
let AC;
function beep(f,dur=.12,type='sine',vol=.05){
  if(!$('sndChk').checked)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.value=vol;
    g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+dur);
    o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+dur);}catch(e){}
}

/* ═══ поток котировок (все пары в одном WS) ═══ */
function setWs(state,txt){$('wsTxt').textContent=txt;$('wsTxt').className='text-xs '+(state==='ok'?'text-green-400':state==='warn'?'text-amber-400':'text-red-400');}
function connect(){
  try{ws&&ws.close()}catch(e){}
  if(!sel.size){setWs('warn','нет выбранных пар');return;}
  setWs('warn','подключение…');
  const streams=[...sel].map(s=>s.toLowerCase()+'@trade').join('/');
  ws=new WebSocket('wss://stream.binance.com:9443/stream?streams='+streams);
  ws.onopen=()=>{retries=0;setWs('ok','live: '+[...sel].map(s=>s.replace('USDT','')).join(', '));stopPoll();};
  ws.onmessage=e=>{const m=JSON.parse(e.data);
    if(m.stream&&m.data){const sym=m.stream.split('@')[0].toUpperCase();
      onPrice(sym,parseFloat(m.data.p),m.data.T);}};
  ws.onclose=()=>{setWs('err','переподключение…');
    if(++retries===3){log('warn','WS недоступен — REST-опрос');startPoll();}
    setTimeout(connect,Math.min(15000,800*Math.pow(2,retries)));};
}
function startPoll(){if(pollTimer)return;
  pollTimer=setInterval(async()=>{for(const sym of sel){try{
    const r=await fetch(`https://api.binance.com/api/v3/ticker/price?symbol=${sym}`);
    const j=await r.json();onPrice(sym,parseFloat(j.price),Date.now());}catch(e){}}},1300);}
function stopPoll(){clearInterval(pollTimer);pollTimer=null;}

function onPrice(sym,p,eventTs){
  const st=P[sym];if(!st)return;
  st.prev=st.price;st.price=p;st.ticks++;
  G.lat=Math.max(0,Date.now()-eventTs);$('latEl').textContent=G.lat+' мс';
  st.emaF=st.emaF==null?p:p+(2/26)*(p-st.emaF);
  st.emaS=st.emaS==null?p:p+(2/100)*(p-st.emaS);
  const now=Date.now();
  if(now-st.lastHist>250){st.lastHist=now;st.hist.push(p);if(st.hist.length>240)st.hist.shift();}
  if(G.running)engine(st,p);
  updatePair(st);scheduleDraw();
  if(now-G.lastEqPush>300){G.lastEqPush=now;pushEq();}
}

/* ═══ движок корзины (на пару) ═══ */
function basketU(st,price){let u=0;for(const o of st.basket.orders)
  u+=(o.side==='BUY'?price-o.entry:o.entry-price)*o.qty;return u;}
function netQty(b){let q=0;for(const o of b.orders)q+=(o.side==='BUY'?o.qty:-o.qty);return q;}
function totalExp(b){let e=0;for(const o of b.orders)e+=o.usd;return e;}
function countSide(b,s){let n=0;for(const o of b.orders)if(o.side===s)n++;return n;}

function canAdd(st){const b=st.basket,c=cfg();
  if(b.orders.length>=c.maxOrders){if(!b.warnedLim){b.warnedLim=true;log('warn',`[${st.sym}] лимит ставок`);}return false;}
  if(totalExp(b)+c.base>c.base*200){if(!b.warnedLim){b.warnedLim=true;log('warn',`[${st.sym}] лимит экспозиции`);}return false;}
  return true;}
function _add(st,side,price,kind){
  const b=st.basket,c=cfg(),entry=roundStep(price,st.tickSize);
  const qty=Math.max(1e-6,Math.round((c.base/entry)*1e6)/1e6);
  const o={id:++G.oid,side,entry,qty,usd:round2(qty*entry),kind};
  b.orders.push(o);b.warnedLim=false;b.lastDir=side;b.lastEntry=entry;
  const T={start:'СТАРТ',flip:'КОМП',pyr:'ПИРАМ'};
  log(kind==='flip'?'flip':(side==='BUY'?'buy':'sell'),
    `[${st.sym}] ${T[kind]} ${side} #${o.id} @ ${fmt(entry)} · $${fmt(o.usd)}`);
  beep(kind==='flip'?500:(side==='BUY'?620:440),.05,'square',.03);
  renderBets(st);return o;}
function addBets(st,side,price,n,kind){for(let i=0;i<n;i++){if(!canAdd(st))break;_add(st,side,price,kind);}}
function bringToOne(st,side,price,reason){
  const b=st.basket,own=countSide(b,side),opp=countSide(b,side==='BUY'?'SELL':'BUY');
  const need=opp+1-own;if(need<=0)return;
  log('flip',`[${st.sym}] ${reason}: ${side} ×${need} → ${opp+1} против ${opp}`);
  addBets(st,side,price,need,'flip');}
function openBasket(st,dir){
  st.basket={orders:[],peakU:0,openRealized:st.realized,flipArmed:true,
             lastDir:null,lastEntry:0,warnedLim:false};
  st.warmWarned=false;
  log('sys',`[${st.sym}] новая корзина · ${dir} · $${fmt(cfg().base)}`);
  _add(st,dir,st.price,'start');}
function closeBasket(st,reason){
  const b=st.basket,price=st.price,u=round2(basketU(st,price));
  const win=u>=0;
  st.realized=round2(st.realized+u);st.baskets++;
  if(win)st.wins++;else st.losses++;
  G.baskets++;win?G.wins++:G.losses++;
  /* итог по каждой ставке */
  let w=0,l=0;
  for(const o of b.orders){
    const op=(o.side==='BUY'?price-o.entry:o.entry-price)*o.qty;
    if(op>=0){w++;st.ordWin++;G.ordWin++;st.ordWinSum+=op;G.ordWinSum+=op;}
    else{l++;st.ordLoss++;G.ordLoss++;st.ordLossSum+=op;G.ordLossSum+=op;}}
  log(win?'ok':'err',`[${st.sym}] корзина закрыта [${reason}] ${fmtS(u)} $ · ставок ${w} в плюс / ${l} в минус`);
  banner(`${st.sym}: корзина ${fmtS(u)} $ · ставки ${w}/${l}`,win);
  win?beep(880,.16):beep(190,.28,'sawtooth',.06);
  st.basket=null;st.lastCloseTs=Date.now();
  renderBets(st);renderStats();save();}
function engine(st,price){
  if(!st.basket){
    if(Date.now()-st.lastCloseTs<cfg().cooldown)return;
    if(st.ticks<80){if(!st.warmWarned){st.warmWarned=true;log('sys',`[${st.sym}] прогрев EMA…`);}return;}
    const c=cfg();
    openBasket(st,c.dir==='auto'?(st.emaF>=st.emaS?'BUY':'SELL'):c.dir);return;
  }
  const b=st.basket,c=cfg();
  const u=basketU(st,price);
  if(u>b.peakU)b.peakU=u;
  if(u>=c.tp)return closeBasket(st,'цель '+fmt(c.tp)+' $');
  if(b.peakU>0&&u<=b.peakU-0.01)return closeBasket(st,'просадка $0.01 от пика');
  if(u<=-c.maxDD)return closeBasket(st,'стоп-просадка −'+fmt(c.maxDD)+' $');
  const step=c.step/100;
  if(u<0){
    if(b.flipArmed){
      b.flipArmed=false;
      const nb=countSide(b,'BUY'),ns=countSide(b,'SELL');
      const dir=nb>ns?'SELL':ns>nb?'BUY':(b.lastDir==='BUY'?'SELL':'BUY');
      bringToOne(st,dir,price,'баланс в минусе');
    }
    else if(price>=b.lastEntry*(1+step))bringToOne(st,'BUY',price,'движение вверх');
    else if(price<=b.lastEntry*(1-step))bringToOne(st,'SELL',price,'движение вниз');
  }else{
    b.flipArmed=true;
    const fav=b.lastDir==='BUY'?price>=b.lastEntry*(1+step):price<=b.lastEntry*(1-step);
    if(fav&&canAdd(st))_add(st,b.lastDir,price,'pyr');
  }
}
G.oid=0;

/* ═══ UI: карточки пар ═══ */
function buildPairBox(){
  const box=$('pairBox');box.innerHTML='';
  PAIRS.forEach(sym=>{
    const l=document.createElement('label');
    l.className='flex items-center gap-1 text-xs mono cursor-pointer select-none';
    l.innerHTML=`<input type="checkbox" class="accent-green-500" value="${sym}" ${sel.has(sym)?'checked':''}> ${sym.replace('USDT','')}`;
    l.querySelector('input').onchange=e=>{
      const s=e.target.value;
      if(e.target.checked){sel.add(s);log('sys',`[${s}] пара подключена`);}
      else{const st=P[s];if(st.basket)closeBasket(st,'отключение пары');sel.delete(s);log('sys',`[${s}] пара отключена`);}
      buildCards();connect();save();};
    box.appendChild(l);});
}
function buildCards(){
  const host=$('cards');host.innerHTML='';
  for(const sym of sel){
    const st=P[sym];
    const d=document.createElement('section');
    d.className='bg-[#161b22] border border-[#30363d] rounded p-3 flex flex-col gap-2';
    d.innerHTML=`
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2"><b>${sym}</b><span class="status text-[10px] px-1.5 py-0.5 rounded border border-[#30363d] text-gray-400">ОЖИДАНИЕ</span></div>
        <div class="price mono text-lg font-semibold">—</div>
      </div>
      <div class="flex items-end justify-between">
        <div><div class="text-[10px] uppercase text-gray-500">PnL корзины</div>
          <div class="pnl mono text-2xl font-bold">+0.00</div></div>
        <div class="text-right"><div class="text-[10px] uppercase text-gray-500">Реализовано</div>
          <div class="real mono text-sm font-semibold">$0.00</div></div>
      </div>
      <div class="h-1.5 bg-[#0d1117] border border-[#30363d] rounded overflow-hidden"><div class="prog h-full w-0 bg-green-600"></div></div>
      <div class="grid grid-cols-2 gap-x-4 text-xs">
        <div class="flex justify-between border-t border-[#21262d] py-1"><span class="text-gray-500">Ставки B/S</span><span class="kvBS mono">—</span></div>
        <div class="flex justify-between border-t border-[#21262d] py-1"><span class="text-gray-500">Нетто</span><span class="kvNet mono">—</span></div>
        <div class="flex justify-between border-t border-[#21262d] py-1"><span class="text-gray-500">Пик PnL</span><span class="kvPeak mono">—</span></div>
        <div class="flex justify-between border-t border-[#21262d] py-1"><span class="text-gray-500">Запас/стоп</span><span class="kvGuard mono">—</span></div>
        <div class="flex justify-between border-t border-[#21262d] py-1"><span class="text-gray-500">Экспозиция</span><span class="kvExp mono">—</span></div>
        <div class="flex justify-between border-t border-[#21262d] py-1"><span class="text-gray-500">Ставок всего</span><span class="kvCnt mono">—</span></div>
      </div>
      <div class="ostat text-xs">Ставок: <span class="ow text-green-400 mono">0</span> выиграно / <span class="ol text-red-400 mono">0</span> проиграно</div>
      <canvas class="spark w-full h-10 block"></canvas>
      <div class="bets max-h-28 overflow-y-auto mono text-[11px] flex flex-col"></div>`;
    host.appendChild(d);
    st.el={status:d.querySelector('.status'),price:d.querySelector('.price'),pnl:d.querySelector('.pnl'),
      real:d.querySelector('.real'),prog:d.querySelector('.prog'),kvBS:d.querySelector('.kvBS'),
      kvNet:d.querySelector('.kvNet'),kvPeak:d.querySelector('.kvPeak'),kvGuard:d.querySelector('.kvGuard'),
      kvExp:d.querySelector('.kvExp'),kvCnt:d.querySelector('.kvCnt'),ow:d.querySelector('.ow'),ol:d.querySelector('.ol'),
      spark:d.querySelector('.spark'),bets:d.querySelector('.bets')};
    updatePair(st);
  }
}
function updatePair(st){
  const e=st.el;if(!e)return;
  e.price.textContent=fmt(st.price);
  e.price.style.color=st.price>st.prev?'#4ade80':st.price<st.prev?'#f87171':'';
  e.real.textContent=fmtS(st.realized)+' $';
  e.real.style.color=st.realized>=0?'#4ade80':'#f87171';
  e.ow.textContent=st.ordWin;e.ol.textContent=st.ordLoss;
  if(st.basket){
    const b=st.basket,c=cfg(),u=basketU(st,st.price);
    e.pnl.textContent=fmtS(u)+' $';e.pnl.style.color=u>=0?'#4ade80':'#f87171';
    e.prog.style.width=Math.max(0,Math.min(100,u/c.tp*100))+'%';
    e.prog.style.background=u<0?'#dc2626':'';
    const nb=countSide(b,'BUY'),ns=countSide(b,'SELL');
    e.kvBS.textContent=`${nb} / ${ns}`;
    const net=netQty(b);
    e.kvNet.textContent=Math.abs(net)<1e-9?'лок':fmtS(net,4);
    e.kvNet.style.color=net>0?'#4ade80':net<0?'#f87171':'#fbbf24';
    e.kvPeak.textContent=fmtS(b.peakU)+' $';
    e.kvGuard.textContent=b.peakU>0?fmt(u-(b.peakU-0.01))+' $':fmt(u+c.maxDD)+' $';
    e.kvExp.textContent='$'+fmt(totalExp(b));
    e.kvCnt.textContent=`${b.orders.length}/${c.maxOrders}`;
    let stTxt,stCls;
    if(u<0){stTxt='КОМПЕНСАЦИЯ';stCls='text-[10px] px-1.5 py-0.5 rounded border border-red-700 text-red-400';}
    else if(b.peakU>0){stTxt='НАБОР';stCls='text-[10px] px-1.5 py-0.5 rounded border border-green-700 text-green-400';}
    else{stTxt='СТАРТ';stCls='text-[10px] px-1.5 py-0.5 rounded border border-gray-600 text-gray-400';}
    e.status.textContent=stTxt;e.status.className='status '+stCls;
    let tot=0;
    for(const o of b.orders){
      const r=st.rowRefs.get(o.id);if(!r)continue;
      const op=(o.side==='BUY'?st.price-o.entry:o.entry-st.price)*o.qty;tot+=op;
      r.textContent=fmtS(op);r.style.color=op>=0?'#4ade80':'#f87171';}
  }else{
    e.pnl.textContent='+0.00 $';e.pnl.style.color='#9ca3af';
    e.prog.style.width='0%';
    ['kvBS','kvNet','kvPeak','kvGuard','kvExp','kvCnt'].forEach(k=>{e[k].textContent='—';e[k].style.color='';});
    e.status.textContent=G.running?'ПАУЗА':'ОЖИДАНИЕ';
    e.status.className='status text-[10px] px-1.5 py-0.5 rounded border border-[#30363d] text-gray-400';
  }
}
function renderBets(st){
  const e=st.el;if(!e)return;
  e.bets.innerHTML='';st.rowRefs.clear();
  if(!st.basket)return;
  const K={start:['С','text-sky-400'],flip:['К','text-amber-400'],pyr:['П','text-green-400']};
  st.basket.orders.forEach(o=>{
    const row=document.createElement('div');
    row.className='flex justify-between gap-2 border-t border-[#21262d] py-0.5';
    row.innerHTML=`<span class="text-gray-500">#${o.id} <span class="${K[o.kind][1]}">${K[o.kind][0]}</span>
      <span class="${o.side==='BUY'?'text-green-400':'text-red-400'}">${o.side}</span> @ ${fmt(o.entry)}</span><span class="p"></span>`;
    e.bets.appendChild(row);
    st.rowRefs.set(o.id,row.querySelector('.p'));});
}

/* ═══ итоговая статистика ═══ */
function renderStats(){
  let real=0;for(const sym of sel)real+=P[sym].realized;
  let realAll=0;for(const k in P)realAll+=P[k].realized;
  const el=$('stReal');el.textContent=fmtS(realAll)+' $';el.style.color=realAll>=0?'#4ade80':'#f87171';
  $('stOW').textContent=G.ordWin;$('stOWsum').textContent='+$'+fmt(G.ordWinSum);
  $('stOL').textContent=G.ordLoss;$('stOLsum').textContent='−$'+fmt(Math.abs(G.ordLossSum));
  const net=G.ordWinSum+G.ordLossSum,tot=G.ordWin+G.ordLoss;
  const en=$('stONet');en.textContent=fmtS(net)+' $';en.style.color=net>=0?'#4ade80':'#f87171';
  $('stORate').textContent=tot?`winrate ${fmt(G.ordWin/tot*100,0)}%`:'—';
  $('stB').textContent=G.baskets;$('stW').textContent=G.wins;$('stL').textContent=G.losses;
  $('stWR').textContent=G.baskets?fmt(G.wins/G.baskets*100,0)+'%':'—';
}
function pushEq(){
  let eq=0;for(const k in P){eq+=P[k].realized;
    if(P[k].basket)eq+=basketU(P[k],P[k].price);}
  G.eqHist.push(round2(eq));if(G.eqHist.length>320)G.eqHist.shift();
}

/* ═══ графики ═══ */
function fit(cv){const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;
  if(cv.width!==Math.round(r.width*d)||cv.height!==Math.round(r.height*d)){cv.width=Math.round(r.width*d);cv.height=Math.round(r.height*d);}
  const ctx=cv.getContext('2d');ctx.setTransform(d,0,0,d,0,0);return{ctx,w:r.width,h:r.height};}
let rafPend=false;
function scheduleDraw(){if(rafPend)return;rafPend=true;requestAnimationFrame(()=>{rafPend=false;drawAll();});}
function drawAll(){
  for(const sym of sel){const st=P[sym];if(!st.el)continue;
    const{ctx,w,h}=fit(st.el.spark);ctx.clearRect(0,0,w,h);
    const v=st.hist;if(v.length<2)continue;
    let mn=Math.min(...v),mx=Math.max(...v);if(mx-mn<1e-9){mx+=1;mn-=1;}
    const up=v[v.length-1]>=v[0],col=up?'#4ade80':'#f87171';
    ctx.beginPath();
    v.forEach((x,i)=>{const X=i/(v.length-1)*(w-2)+1,Y=2+(mx-x)/(mx-mn)*(h-4);
      i?ctx.lineTo(X,Y):ctx.moveTo(X,Y);});
    ctx.strokeStyle=col;ctx.lineWidth=1.3;ctx.stroke();}
  const{ctx,w,h}=fit($('eqCanvas'));ctx.clearRect(0,0,w,h);
  const v=G.eqHist;
  if(v.length>1){
    let mn=Math.min(...v),mx=Math.max(...v);if(mx-mn<.02){mx+=.01;mn-=.01;}
    const Y=x=>2+(mx-x)/(mx-mn)*(h-4),X=i=>i/(v.length-1)*(w-2)+1;
    const up=v[v.length-1]>=v[0];
    ctx.beginPath();v.forEach((x,i)=>{i?ctx.lineTo(X(i),Y(x)):ctx.moveTo(X(i),Y(x));});
    ctx.strokeStyle=up?'#4ade80':'#f87171';ctx.lineWidth=1.4;ctx.stroke();}
  else{ctx.fillStyle='#6b7280';ctx.font='10px IBM Plex Sans';ctx.fillText('накопление…',4,h/2+3);}
}

/* ═══ сохранение ═══ */
function save(){try{
  const pairs={};for(const k in P)pairs[k]={realized:P[k].realized,baskets:P[k].baskets,wins:P[k].wins,
    losses:P[k].losses,ordWin:P[k].ordWin,ordLoss:P[k].ordLoss,ordWinSum:P[k].ordWinSum,ordLossSum:P[k].ordLossSum};
  localStorage.setItem(LS,JSON.stringify({
    G:{baskets:G.baskets,wins:G.wins,losses:G.losses,ordWin:G.ordWin,ordLoss:G.ordLoss,
       ordWinSum:G.ordWinSum,ordLossSum:G.ordLossSum},
    pairs,cfg:{b:$('baseUsd').value,t:$('tpUsd').value,s:$('stepAdd').value,d:$('maxDD').value,
       o:$('maxOrd').value,c:$('cooldownMs').value,m:$('dirMode').value},
    sel:[...sel]}));}catch(e){}}
function load(){try{const j=JSON.parse(localStorage.getItem(LS)||'null');if(!j)return;
  Object.assign(G,j.G||{});
  if(j.pairs)for(const k in j.pairs){initPair(k);Object.assign(P[k],j.pairs[k]);}
  if(j.cfg){$('baseUsd').value=j.cfg.b;$('tpUsd').value=j.cfg.t;$('stepAdd').value=j.cfg.s;
    $('maxDD').value=j.cfg.d;$('maxOrd').value=j.cfg.o;$('cooldownMs').value=j.cfg.c;$('dirMode').value=j.cfg.m;}
  if(j.sel&&j.sel.length){sel.clear();j.sel.forEach(s=>sel.add(s));}
  log('sys','Статистика восстановлена');}catch(e){}}

/* ═══ управление ═══ */
$('btnStart').onclick=()=>{
  G.running=true;$('btnStart').disabled=true;$('btnStop').disabled=false;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume&&AC.resume();}catch(e){}
  log('ok','▶ Автопилот запущен: '+[...sel].join(', '));beep(700,.08);};
$('btnStop').onclick=()=>{
  G.running=false;$('btnStart').disabled=false;$('btnStop').disabled=true;
  log('warn','■ Автопилот остановлен (корзины заморожены)');beep(340,.1);};
$('btnReset').onclick=()=>{
  if(!confirm('Сбросить всю статистику?'))return;
  localStorage.removeItem(LS);location.reload();};
['baseUsd','tpUsd','stepAdd','maxDD','maxOrd','cooldownMs','dirMode']
  .forEach(id=>$(id).addEventListener('change',save));

/* ═══ init ═══ */
setInterval(()=>$('clock').textContent=new Date().toLocaleString('ru-RU',{hour:'2-digit',minute:'2-digit',second:'2-digit'}),1000);
setInterval(()=>{for(const sym of sel){const st=P[sym];
  if(st&&!st.tickFetched){st.tickFetched=true;
    fetch(`https://api.binance.com/api/v3/exchangeInfo?symbol=${sym}`).then(r=>r.json()).then(j=>{
      st.tickSize=parseFloat(j.filters.find(f=>f.filterType==='PRICE_FILTER').tickSize)||.01;}).catch(()=>{});}}},4000);
load();buildPairBox();buildCards();renderStats();connect();
log('sys','Автопилот v5: у каждой пары своя корзина, ставка фиксированная, инвариант «на одну больше».');
log('warn','Режим PAPER: комиссии не учитываются.');
</script>
